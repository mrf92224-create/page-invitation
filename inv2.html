<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Invitation</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #2b2d42, #0f0f1a);
        font-family: 'Segoe UI', sans-serif;
        color: white;
        perspective: 1000px;
    }

    .container {
        text-align: center;
    }

    /* OPEN ME MESSAGE */
    .open-text {
        margin-bottom: 12px;
        font-weight: bold;
        font-size: 18px;
        letter-spacing: 3px;
        color: #ffd166;
        animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    /* GIFT BOX */
    .box {
        width: 220px;
        height: 180px;
        background: linear-gradient(145deg, #d62828, #a4161a);
        border-radius: 12px;
        position: relative;
        cursor: pointer;
        box-shadow:
            0 25px 40px rgba(0,0,0,0.5),
            inset 0 6px 10px rgba(255,255,255,0.2);
        transform-style: preserve-3d;
        animation: shake 1.5s infinite;
        transition: opacity 1s ease, transform 1s ease;
        margin-left: 50px;
        margin-top: 80px;
    }

    @keyframes shake {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(1.5deg); }
        50% { transform: rotate(0deg); }
        75% { transform: rotate(-1.5deg); }
        100% { transform: rotate(0deg); }
    }

    .lid {
        position: absolute;
        top: -55px;
        left: 0;
        width: 220px;
        height: 55px;
        background: linear-gradient(145deg, #ba181b, #8a0f13);
        border-radius: 12px 12px 6px 6px;
        transform-origin: bottom;
        transition: transform 1s ease;
        box-shadow: 0 10px 15px rgba(0,0,0,0.4);
    }

    .box.open {
        animation: none;
    }

    .box.open .lid {
        transform: rotateX(140deg);
    }

    .ribbon-vertical,
    .ribbon-horizontal {
        position: absolute;
        background: linear-gradient(145deg, #ffd166, #fcbf49);
        box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
    }

    .ribbon-vertical {
        width: 28px;
        height: 100%;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 6px;
    }

    .ribbon-horizontal {
        height: 28px;
        width: 100%;
        top: 50%;
        transform: translateY(-50%);
        border-radius: 6px;
    }

    /* BOX DISAPPEAR */
    .box.hide {
        opacity: 0;
        transform: scale(0.5);
        pointer-events: none;
    }

    /* MESSAGE */
    .message {
        margin-top: 35px;
        max-width: 380px;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 1s ease, transform 1s ease;
    }

    .message.show {
        opacity: 1;
        transform: translateY(0);
    }

    .message h2 {
        color: #ffd166;
        margin-bottom: 10px;
    }

    /* Mobile responsiveness */
    @media (max-width: 600px) {
        .box {
            width: 180px;
            height: 140px;
            margin-left: 20px;
            margin-top: 40px;
        }
        .lid {
            width: 180px;
            height: 40px;
            top: -40px;
        }
        .open-text {
            font-size: 14px;
        }
        .message {
            max-width: 300px;
            margin-top: 20px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="open-text" id="openText">OPEN ME !!</div>

    <div class="box" id="giftBox">
        <div class="lid"></div>
        <div class="ribbon-vertical"></div>
        <div class="ribbon-horizontal"></div>
    </div>

    <div class="message" id="message">
        <h2>🎉 You're Invited! 🎉</h2>
        <p>
            This is an invitation to my <strong>19th birthday</strong> 🎂<br><br>

            📅 <strong>Saturday, 3rd of January</strong><br>
            ⏰ <strong>2:00 PM – 7:00 PM</strong><br>
            📍 <strong>Albero Café</strong><br><br>

            ✨ End of the week vibes only
        </p>
           <p> 3id miledi raw ija na3mlo jaw </p>
    </div>
</div>

<script>
    const box = document.getElementById("giftBox");
    const message = document.getElementById("message");
    const openText = document.getElementById("openText");

    box.addEventListener("click", () => {
        openText.style.display = "none"; // message disappears
        box.classList.add("open");

        setTimeout(() => {
            box.classList.add("hide");
            message.classList.add("show");
        }, 900);
    });
</script>

</body>
</html>
